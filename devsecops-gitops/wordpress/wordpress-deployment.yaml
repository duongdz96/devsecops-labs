apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: devsecops-wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: devsecops-wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/part-of: devsecops-wordpress
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: wordpress
          image: host.docker.internal:8083/devsecops-lab/wordpress@sha256:1cccb9aff094620fe4794413900a40b5bbb8bb15c0f8168bbf1fe94499cdb99f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MYSQL_DATABASE
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MYSQL_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MYSQL_PASSWORD
            - name: WORDPRESS_DEBUG
              value: "false"
            - name: XDEBUG_MODE
              value: "off"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
