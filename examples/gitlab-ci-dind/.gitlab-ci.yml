stages:
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

check-docker-client:
  stage: test
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  script:
    - docker version
    - docker info

build-demo-image:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  script:
    - docker build -t vinfast/gitlab-ci-dind-demo:${CI_COMMIT_SHORT_SHA} .
    - docker run --rm vinfast/gitlab-ci-dind-demo:${CI_COMMIT_SHORT_SHA}
