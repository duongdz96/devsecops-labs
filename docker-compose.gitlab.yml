name: devsecops-labs-gitlab

services:
  gitlab:
    image: ${GITLAB_IMAGE}
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME}
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOSTNAME}:${GITLAB_HTTP_PORT}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 10
        prometheus_monitoring['enable'] = false
    ports:
      - "${GITLAB_HTTP_PORT}:${GITLAB_HTTP_PORT}"
      - "${GITLAB_SSH_PORT}:22"
    volumes:
      - "${GITLAB_CONFIG_DIR}:/etc/gitlab"
      - "${GITLAB_LOGS_DIR}:/var/log/gitlab"
      - "${GITLAB_DATA_DIR}:/var/opt/gitlab"
      # GitLab Workhorse/Rails needs Linux rename/chmod semantics for artifact temp files.
      - "gitlab-artifacts:/var/opt/gitlab/gitlab-rails/shared/artifacts"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${GITLAB_HTTP_PORT}/users/sign_in >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - cicd-lab

  gitlab-runner:
    image: ${GITLAB_RUNNER_IMAGE}
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - "${GITLAB_RUNNER_CONFIG_DIR}:/etc/gitlab-runner"
      # Lab-only Docker executor access. Treat this runner as host-root equivalent.
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - cicd-lab

volumes:
  gitlab-artifacts:

networks:
  cicd-lab:
    external: true
    name: devsecops-labs-cicd
